[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-ig-bridge"
version = "0.1.0"
license = "MIT"
description = "Instagram Reels and Direct for Instagram for Lumen (Rokid Lumen glasses)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "instagrapi==3.0.19",
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "python-multipart==0.0.32",
  "httpx[socks]==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["lumen_ig_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
